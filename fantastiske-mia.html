<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantastiske Mia</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fde8f0 0%, #f5e6f8 25%, #ece8fb 55%, #fce4ec 80%, #fdeef5 100%);
      background-attachment: fixed;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* ── Floating petals ── */
    #petalContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .petal {
      position: absolute;
      top: -60px;
      opacity: 0;
      animation: petalFall linear infinite;
      user-select: none;
    }

    @keyframes petalFall {
      0%   { transform: translateY(0)      rotate(0deg)   translateX(0);     opacity: 0; }
      5%   { opacity: 0.75; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(110vh)  rotate(540deg) translateX(40px);  opacity: 0; }
    }

    /* ── Fixed corner flowers ── */
    .corner {
      position: fixed;
      font-size: 3.5rem;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
      animation: sway 6s ease-in-out infinite;
    }
    .corner.tl { top: 16px;  left: 16px;  transform-origin: bottom right; animation-delay: 0s; }
    .corner.tr { top: 16px;  right: 16px; transform-origin: bottom left;  animation-delay: 1.5s; }
    .corner.bl { bottom: 16px; left: 16px;  transform-origin: top right; animation-delay: 3s; }
    .corner.br { bottom: 16px; right: 16px; transform-origin: top left;  animation-delay: 4.5s; }

    @keyframes sway {
      0%,100% { transform: rotate(-8deg); }
      50%      { transform: rotate(8deg); }
    }

    /* ── Layout ── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 44px 20px 60px;
      text-align: center;
    }

    /* ── Header ── */
    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c986c4;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      line-height: 1.1;
      background: linear-gradient(100deg, #d63ea0 0%, #9c27b0 40%, #d63ea0 80%, #c2185b 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 0%   center; }
      100% { background-position: 250% center; }
    }

    .header-deco {
      font-size: 1.3rem;
      letter-spacing: 10px;
      color: #e8a0d0;
      margin-top: 10px;
      margin-bottom: 36px;
    }

    /* ── Date navigation ── */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(200,80,180,0.25);
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(8px);
      font-size: 1.1rem;
      color: #9c27b0;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: rgba(233,30,140,0.12); transform: scale(1.12); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

    .date-display {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #6a1b9a;
      cursor: pointer;
      text-decoration: underline dotted #c986c4;
      text-underline-offset: 4px;
      min-width: 240px;
      transition: color 0.2s;
    }
    .date-display:hover { color: #d63ea0; }

    #datePicker {
      display: none;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      padding: 6px 14px;
      border: 1.5px solid rgba(156,39,176,0.35);
      border-radius: 22px;
      background: rgba(255,255,255,0.85);
      color: #6a1b9a;
      outline: none;
      cursor: pointer;
    }

    .today-btn {
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: white;
      border: none;
      border-radius: 22px;
      padding: 7px 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.2s, transform 0.2s;
      margin-bottom: 26px;
    }
    .today-btn:hover { opacity: 1; transform: scale(1.04); }

    /* ── Special day banner ── */
    .special-banner {
      display: none;
      background: linear-gradient(135deg, rgba(255,235,59,0.25), rgba(255,150,200,0.3));
      border: 1.5px solid rgba(255,200,100,0.5);
      border-radius: 18px;
      padding: 12px 22px;
      margin-bottom: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #7b1fa2;
      letter-spacing: 0.3px;
      animation: fadeSlideIn 0.5s ease;
    }

    /* ── Main card ── */
    .card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 44px 38px 32px;
      box-shadow:
        0 12px 48px rgba(156,39,176,0.1),
        0 2px 10px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.9);
      border: 1.5px solid rgba(255,255,255,0.85);
      position: relative;
      animation: fadeSlideIn 0.7s ease;
      margin-bottom: 16px;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .big-quote {
      font-family: 'Playfair Display', serif;
      font-size: 6rem;
      line-height: 0.4;
      color: rgba(211,63,160,0.12);
      position: absolute;
      top: 22px;
      left: 26px;
      user-select: none;
    }

    .sentence {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      line-height: 1.85;
      color: #3d1050;
      font-style: italic;
      position: relative;
      z-index: 1;
    }

    /* ── Heart button ── */
    .heart-wrap {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .heart-btn {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
      line-height: 1;
    }
    .heart-btn:hover { transform: scale(1.2); }

    @keyframes heartPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.5); }
      70%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .heart-btn.pop { animation: heartPop 0.4s ease; }

    .heart-label {
      font-size: 0.78rem;
      color: #c986c4;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .day-label {
      font-size: 0.78rem;
      color: #c0a0d0;
      margin-top: 6px;
    }

    /* ── Favorites ── */
    .fav-section { margin-top: 28px; text-align: left; }

    .fav-toggle {
      width: 100%;
      background: rgba(255,255,255,0.6);
      border: 1.5px solid rgba(200,80,180,0.2);
      border-radius: 22px;
      padding: 11px 22px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #7b1fa2;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .fav-toggle:hover { background: rgba(255,255,255,0.9); }

    .fav-list {
      display: none;
      margin-top: 14px;
    }
    .fav-list.open { display: block; }

    .fav-empty {
      text-align: center;
      color: #c986c4;
      font-style: italic;
      padding: 22px;
      font-size: 0.9rem;
    }

    .fav-item {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 16px 44px 16px 20px;
      margin-bottom: 10px;
      border-left: 3.5px solid #e91e8c;
      position: relative;
      animation: fadeSlideIn 0.4s ease;
    }

    .fav-item-date {
      font-size: 0.72rem;
      color: #c986c4;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .fav-item-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #3d1050;
      font-size: 0.93rem;
      line-height: 1.65;
    }

    .fav-remove {
      position: absolute;
      top: 12px; right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: #d9aad9;
      transition: color 0.2s;
      font-weight: 700;
    }
    .fav-remove:hover { color: #c2185b; }

    /* ── Footer ── */
    footer {
      margin-top: 48px;
      color: #d4a0d0;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Corner flowers -->
  <div class="corner tl">🌸</div>
  <div class="corner tr">🌺</div>
  <div class="corner bl">🌷</div>
  <div class="corner br">🌸</div>

  <!-- Floating petals -->
  <div id="petalContainer"></div>

  <div class="container">

    <header>
      <p class="eyebrow">✨ &nbsp; Dagens ord til deg &nbsp; ✨</p>
      <h1>Fantastiske Mia</h1>
      <div class="header-deco">❀ &nbsp; ❀ &nbsp; ❀</div>
    </header>

    <!-- Date nav -->
    <div class="date-nav">
      <button class="nav-btn" id="prevDay" title="Forrige dag">&#8592;</button>
      <div>
        <div class="date-display" id="dateDisplay" onclick="togglePicker()"></div>
        <input type="date" id="datePicker" onchange="onPickerChange()">
      </div>
      <button class="nav-btn" id="nextDay" title="Neste dag">&#8594;</button>
    </div>
    <button class="today-btn" onclick="goToday()">I dag</button>

    <!-- Special banner -->
    <div class="special-banner" id="specialBanner"></div>

    <!-- Main card -->
    <div class="card" id="mainCard">
      <div class="big-quote">&ldquo;</div>
      <p class="sentence" id="sentenceText"></p>
      <div class="heart-wrap">
        <button class="heart-btn" id="heartBtn" onclick="toggleFav()" title="Lagre som favoritt">🤍</button>
        <span class="heart-label" id="heartLabel">Lagre som favoritt</span>
      </div>
      <div class="day-label" id="dayLabel"></div>
    </div>

    <!-- Favorites -->
    <div class="fav-section">
      <button class="fav-toggle" onclick="toggleFavList()">
        ❤️ &nbsp;Mine favorittsetninger &nbsp;(<span id="favCount">0</span>)
      </button>
      <div class="fav-list" id="favList"></div>
    </div>

    <footer>Laget med kjærlighet til Mia &nbsp;💕</footer>
  </div>

  <script>
  // ══════════════════════════════════════════
  //  SENTENCES
  // ══════════════════════════════════════════
  const SENTENCES = [

  // ══════════════════════════════════════════
  //  SPECIAL DAYS  (MM-DD)
  // ══════════════════════════════════════════
  function specialDay(month, day, year) {
    const key = `${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const age = year - 2004;
    const map = {
      '02-11': {
        banner: `🎂🎉 Gratulerer med ${age}-årsdagen, Mia!`,
        sentence: `🎂 GRATULERER MED DAGEN, fantastiske Mia! Du fyller ${age} år i dag, og det er grunn til å feire skikkelig stort! På ${age} år har du gjort verden varmere, morsommere og mer fargerik for alle som kjenner deg. Jon-André, familien og alle vennene dine elsker deg mer enn ord kan si. Nyt hver eneste sekund av denne vakre dagen — du fortjener det alle og mer til! 🎉🌸`,
      },
      '03-08': {
        banner: `💜✊ Gratulerer med Kvinnedagen!`,
        sentence: `På Kvinnedagen hyller vi alle kvinner som gjør verden bedre — og du, Mia, er en av dem som gjør det hver eneste dag. Du er sterk, modig, varm og unik. Du er ikke bare fantastiske Mia — du er et forbilde for alle rundt deg. I dag er din dag til å kjenne på nettopp det. 💜`,
      },
      '05-17': {
        banner: `🇳🇴❤️ Gratulerer med nasjonaldagen!`,
        sentence: `🇳🇴 Gratulerer med 17. mai, Mia! I dag feirer vi et fantastisk land — og i vår lille verden feirer vi deg. Du er like unik og verdifull som dette landet vi er så stolte av. Ta på deg det fineste du har, spis is, kos deg med de du er glad i, og nyt at du er akkurat deg. Hurra for Norge, og hurra for deg! ❤️`,
      },
      '06-01': {
        banner: `☀️🌊 Sommeren er her!`,
        sentence: `☀️ Sommeren begynner i dag — og ingen fortjener en strålende sommer mer enn deg, Mia! La solen varme ansiktet ditt, la latteren runge, la de lange kveldene vare, og la dette bli den beste sommeren hittil. Du har jobbet for det, du fortjener det, og nå er det din tur til å bare nyte livet fullt ut. God sommer! 🌸🌊`,
      },
      '12-24': {
        banner: `🎄✨ God julaften!`,
        sentence: `🎄 Julaften er her, og med den all magien, varmen og kjærligheten som jul bringer. I dag er du omgitt av de du er aller gladest i — og de er så veldig glad i deg. La julekvelden fylle hjertet ditt med glede, kos deg i hvert øyeblikk, og husk at du er årets aller fineste gave til alle som kjenner deg. God jul, fantastiske Mia! ✨🎁`,
      },
    };
    return map[key] || null;
  }

  // ══════════════════════════════════════════
  //  DATE HELPERS
  // ══════════════════════════════════════════
  const NO_MONTHS = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
  const NO_DAYS   = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];

  function formatDate(d) {
    return `${NO_DAYS[d.getDay()]} ${d.getDate()}. ${NO_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }

  function dateKey(d) { return d.toISOString().split('T')[0]; }

  function hashDate(d) {
    const s = `${d.getFullYear()}${d.getMonth()}${d.getDate()}`;
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h % SENTENCES.length;
  }

  function sentenceFor(d) {
    const sp = specialDay(d.getMonth() + 1, d.getDate(), d.getFullYear());
    return sp ? sp.sentence : SENTENCES[hashDate(d)];
  }

  // ══════════════════════════════════════════
  //  STATE
  // ══════════════════════════════════════════
  let current = new Date();
  current.setHours(0,0,0,0);

  // ══════════════════════════════════════════
  //  RENDER
  // ══════════════════════════════════════════
  function render() {
    const sp = specialDay(current.getMonth() + 1, current.getDate(), current.getFullYear());

    // Date display
    document.getElementById('dateDisplay').textContent = formatDate(current);
    document.getElementById('datePicker').value = dateKey(current);

    // Special banner
    const banner = document.getElementById('specialBanner');
    if (sp) {
      banner.style.display = 'block';
      banner.textContent = sp.banner;
    } else {
      banner.style.display = 'none';
    }

    // Card animation re-trigger
    const card = document.getElementById('mainCard');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'fadeSlideIn 0.65s ease';

    // Sentence
    document.getElementById('sentenceText').textContent = sentenceFor(current);

    // Day label
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((current - today) / 86400000);
    const label =
      diff === 0  ? '✨ I dag' :
      diff === -1 ? '📅 I går' :
      diff === 1  ? '📅 I morgen' :
      diff < 0    ? `📅 ${Math.abs(diff)} dager siden` :
                    `📅 Om ${diff} dager`;
    document.getElementById('dayLabel').textContent = label;

    // Prev button — disabled when on start date
    document.getElementById('prevDay').disabled = current <= START_DATE;
    // Next button — disabled when already on today
    const today2 = new Date(); today2.setHours(0,0,0,0);
    document.getElementById('nextDay').disabled = current >= today2;

    // Heart
    refreshHeart();
  }

  // ══════════════════════════════════════════
  //  DATE NAVIGATION
  // ══════════════════════════════════════════
  const START_DATE = new Date(2026, 3, 10); // 10. april 2026

  document.getElementById('prevDay').addEventListener('click', () => {
    if (current > START_DATE) { current.setDate(current.getDate() - 1); render(); }
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    const today = new Date(); today.setHours(0,0,0,0);
    if (current < today) { current.setDate(current.getDate() + 1); render(); }
  });

  function goToday() {
    current = new Date(); current.setHours(0,0,0,0); render();
  }

  function togglePicker() {
    const p = document.getElementById('datePicker');
    const d = document.getElementById('dateDisplay');
    const show = p.style.display !== 'inline-block';
    p.style.display = show ? 'inline-block' : 'none';
    d.style.display = show ? 'none' : 'block';
    if (show) p.focus();
  }

  function onPickerChange() {
    const v = document.getElementById('datePicker').value;
    if (v) {
      const [y, m, day] = v.split('-').map(Number);
      const chosen = new Date(y, m - 1, day);
      chosen.setHours(0,0,0,0);
      const today = new Date(); today.setHours(0,0,0,0);
      current = chosen > today ? today : chosen < START_DATE ? START_DATE : chosen;
    }
    document.getElementById('datePicker').style.display = 'none';
    document.getElementById('dateDisplay').style.display = 'block';
    render();
  }

  // ══════════════════════════════════════════
  //  FAVORITES
  // ══════════════════════════════════════════
  function getFavs()        { return JSON.parse(localStorage.getItem('mia_favs') || '[]'); }
  function setFavs(f)       { localStorage.setItem('mia_favs', JSON.stringify(f)); }
  function isFav(d)         { return getFavs().some(f => f.date === dateKey(d)); }

  function refreshHeart() {
    const fav = isFav(current);
    document.getElementById('heartBtn').textContent  = fav ? '❤️' : '🤍';
    document.getElementById('heartLabel').textContent = fav ? 'Lagret som favoritt ✨' : 'Lagre som favoritt';
    document.getElementById('favCount').textContent   = getFavs().length;
  }

  function toggleFav() {
    const key = dateKey(current);
    let favs  = getFavs();
    const idx = favs.findIndex(f => f.date === key);
    const btn = document.getElementById('heartBtn');

    if (idx >= 0) {
      favs.splice(idx, 1);
    } else {
      favs.unshift({ date: key, dateLabel: formatDate(current), sentence: sentenceFor(current) });
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
    }

    setFavs(favs);
    refreshHeart();
    renderFavList();
  }

  function removeFav(key) {
    setFavs(getFavs().filter(f => f.date !== key));
    refreshHeart();
    renderFavList();
  }

  function renderFavList() {
    const favs = getFavs();
    const list = document.getElementById('favList');
    document.getElementById('favCount').textContent = favs.length;

    if (favs.length === 0) {
      list.innerHTML = '<p class="fav-empty">Ingen favoritter ennå — trykk ❤️ på en setning du liker!</p>';
      return;
    }

    list.innerHTML = favs.map(f => `
      <div class="fav-item">
        <div class="fav-item-date">${f.dateLabel}</div>
        <div class="fav-item-text">&ldquo;${f.sentence}&rdquo;</div>
        <button class="fav-remove" onclick="removeFav('${f.date}')" title="Fjern">&#10005;</button>
      </div>
    `).join('');
  }

  function toggleFavList() {
    document.getElementById('favList').classList.toggle('open');
  }

  // ══════════════════════════════════════════
  //  FLOATING PETALS
  // ══════════════════════════════════════════
  const PETAL_EMOJIS = ['🌸','🌺','🌷','🌼','✿','❀','🌹'];

  function spawnPetal() {
    const c    = document.getElementById('petalContainer');
    const el   = document.createElement('div');
    el.className = 'petal';
    el.textContent = PETAL_EMOJIS[Math.floor(Math.random() * PETAL_EMOJIS.length)];

    const size  = 0.7 + Math.random() * 1.1;
    const dur   = 7  + Math.random() * 9;
    const delay = Math.random() * 4;
    el.style.cssText = `
      left: ${Math.random() * 100}%;
      font-size: ${size}rem;
      animation-duration: ${dur}s;
      animation-delay: ${delay}s;
    `;

    c.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 1) * 1000);
  }

  // Initial burst then steady drip
  for (let i = 0; i < 12; i++) setTimeout(spawnPetal, i * 250);
  setInterval(spawnPetal, 900);

  // ══════════════════════════════════════════
  //  INIT
  // ══════════════════════════════════════════
  const todayKey = dateKey(new Date());
  document.getElementById('datePicker').setAttribute('max', todayKey);
  document.getElementById('datePicker').setAttribute('min', '2026-04-10');

  render();
  renderFavList();
  </script>
</body>
</html>
